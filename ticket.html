<!DOCTYPE html>
<html>
<head>
    <title>Coding Conf | Your Ticket</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/ticket.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="website-title">
                <img src="../assets/CodingConf.png" alt="Coding Conf Logo">
                <span>Coding Conf</span>
            </a>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="login.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="ticket-section">

            <!-- Confirmation Message -->
            <h1 id="confirmationMessage"></h1>

            <p class="ticket-description">
                Your registration is complete.
                Keep your ticket ready for the event.
            </p>

            <!-- Conference Ticket -->
            <article class="conference-ticket">

                <div class="ticket-content">

                    <!-- Conference Branding -->
                    <div class="ticket-brand">
                        <img src="../assets/CodingConf.png"
                            alt="Coding Conf Logo"
                            class="ticket-logo">

                        <div>
                            <h2>Coding Conf</h2>
                            <p>October 26, 2026 | Papine, Kgn</p>
                        </div>
                    </div>

                    <!-- Attendee Details -->
                    <div class="attendee-details">

                        <img id="ticketAvatar"
                             src=""
                             alt="Attendee profile picture">

                        <div class="attendee-info">
                            <h3 id="ticketName"></h3>

                            <a id="ticketGithub"
                               href="#"
                               target="_blank"
                               rel="noopener noreferrer">
                            </a>
                        </div>
                    </div>

                </div>

                <!-- Ticket Number -->
                <div class="ticket-number">
                    <span id="ticketSerial">#01609</span>
                </div>

            </article>

            <a href="index.html" class="back-home">
                Back to Home
            </a>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>

</body>
</html>
