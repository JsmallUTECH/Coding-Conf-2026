<!DOCTYPE html>
<html>
<head>
    <title>Coding Conf | Registration</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/validation.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="website-title">
                <img src="../assets/CodingConf.png" alt="Coding Conf Logo">
                <span>Coding Conf</span>
            </a>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="login.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="registration">
            <h1>Register for Coding Conf 2026</h1>

            <p>
                Complete the form below to generate
                your personalized conference ticket.
            </p>

            <form id="registrationForm" novalidate>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input type="text"
                           id="fullName"
                           name="fullName"
                           placeholder="Enter your full name"
                           autocomplete="name"
                           aria-describedby="nameError"
                           required>

                    <span class="error"
                          id="nameError"></span>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="example@email.com"
                           autocomplete="email"
                           aria-describedby="emailError"
                           required>

                    <span class="error"
                          id="emailError"></span>
                </div>

                <!-- GitHub Username -->
                <div class="form-group">
                    <label for="github">GitHub Username</label>

                    <input type="text"
                           id="github"
                           name="github"
                           placeholder="@username"
                           aria-describedby="githubError"
                           required>

                    <span class="error"
                          id="githubError"></span>
                </div>

                <!-- Avatar Upload -->
                <div class="form-group">
                    <label for="avatar">
                        Upload Avatar (JPEG or PNG, under 500 KB)
                    </label>

                    <input type="file"
                           id="avatar"
                           name="avatar"
                           accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                           aria-describedby="avatarError"
                           required>

                    <span class="error"
                          id="avatarError"></span>
                </div>

                <button type="submit" class="register-btn">
                    Generate My Ticket
                </button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>

</body>
</html>
